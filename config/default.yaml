# k8s-monitor Configuration File
#
# NOTE: This file is a SAMPLE and is NOT loaded automatically.
# viper searches for a file literally named "config.yaml" in:
#   1. ./config/config.yaml
#   2. $HOME/.k8s-monitor/config.yaml
#   3. /etc/k8s-monitor/config.yaml
# To use it, copy this file to one of those locations:
#   cp config/default.yaml config/config.yaml
#
# The keys below are the commonly used settings. All values shown are the
# built-in defaults; remove a key to fall back to its default. For the full
# set of keys viper reads (including ones with no runtime effect yet), see
# internal/app/config.go.

cluster:
  # Path to kubeconfig file. Leave empty to use default ($HOME/.kube/config)
  kubeconfig: ""

  # Kubernetes context to use. Leave empty to use current context
  context: ""

  # Default namespace to monitor. Leave empty for all namespaces
  namespace: ""

refresh:
  # Auto-refresh interval (format: 10s, 1m, etc.)
  interval: 2s

  # Timeout for API requests to the cluster (format: 10s, 1m, etc.)
  timeout: 30s

  # Maximum concurrent requests to API server/kubelet
  max_concurrent: 10

cache:
  # Cache entry TTL
  ttl: 60s

ui:
  # Interface language: en or zh
  locale: en

  # Number of log lines to fetch when viewing pod logs
  log_tail_lines: 200

kubelet:
  # Skip TLS verification when talking to kubelet (test environments only)
  insecure: false

npu_exporter:
  # Custom NPU-Exporter endpoint. Leave empty to auto-detect via the
  # Kubernetes API proxy (e.g. http://npu-exporter.kube-system:8082)
  endpoint: ""

logging:
  # Log level: debug, info, warn, error
  level: info

  # Log file path
  file: /tmp/k8s-monitor.log
