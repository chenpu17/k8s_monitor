# ============================================================================
# 应用信息
# ============================================================================
[app.name]
other = "Kubernetes 监控器"

[app.title]
other = "🔍 Kubernetes 监控器"

[app.author]
other = "陈普"

[app.description]
other = "Kubernetes 集群 CLI 监控控制台"

[app.long_description]
other = "k8s-monitor 是一个轻量级、只读的 Kubernetes 集群 CLI 监控控制台。它提供实时集群健康概览、节点状态、工作负载监控和快速诊断。"

[app.footer]
other = "基于 Bubble Tea 和 client-go 构建 ❤️"

